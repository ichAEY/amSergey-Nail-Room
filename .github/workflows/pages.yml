name: Validate and deploy Nail Room salon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Nail Room production data
        run: |
          node tests/validate-site-data.cjs --production
          node tests/nail-room-ui-contract.cjs
          for f in site-data.js desktop.js mobile.js site-regions.js site-runtime.js; do node --check "$f"; done
      - name: Checkout approved TANEM salon template
        uses: actions/checkout@v4
        with:
          repository: ichAEY/Shablon-only-for-salons
          ref: 33e20e61e2d4382a98518e2d7ac275a4a3d22b8a
          path: .approved-salon
          fetch-depth: 0
      - name: Verify shared salon engine remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html salon-palette.css site-regions.js site-runtime.js scripts/prune-dead-css.cjs scripts/style-cleanup-config.cjs; do
            cmp "$f" ".approved-salon/$f"
          done
      - name: Verify salon factory and regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd .approved-salon
          node tests/check-factory-contract.cjs
          node tests/check-template-regression.cjs
      - name: Package public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          for f in index.html desktop.css desktop.js mobile.css mobile-overrides.css mobile.js salon-palette.css site-data.js site-regions.js site-runtime.js favicon-source.png logo-placeholder.svg media-placeholder.svg hero.webp profile.webp; do
            test -s "$f"
            cp "$f" _site/
          done
          shopt -s nullglob
          for f in gallery-*.webp team-*.webp; do cp "$f" _site/; done
          for f in logo.webp logo.png logo.svg; do if test -f "$f"; then cp "$f" _site/; fi; done
          touch _site/.nojekyll
          test ! -e _site/source-photos
          test ! -e _site/business.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
